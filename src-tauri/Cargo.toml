[package]
name = "rmc-toolkit"
version = "2.0.0"
description = "Game launcher and cheat installer for RPG Maker MV, MZ and VX Ace"
edition = "2024"
license = "MIT"

[lib]
name = "rmc_toolkit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
process-wrap = { version = "11", default-features = false, features = [
  "std",
  "job-object",
  "process-group",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
